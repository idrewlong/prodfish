<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>prodfish — beats</title>
  <meta name="description" content="prodfish. beats from the dark south." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="glow" aria-hidden="true"></div>
  <div id="blackout" aria-hidden="true"></div>
  <div id="loading" aria-hidden="true"><span>entering&hellip;</span></div>

  <header id="hero">
    <h1>fish</h1>
    <p class="hint">scroll<span class="hint-arrow">▾</span></p>
  </header>

  <main id="scroll-track">
    <section id="chapel">
      <div class="panels" role="group" aria-roledescription="carousel" aria-label="beats, credits and about">
        <button class="panel-arrow panel-prev" type="button" aria-label="previous">&#8249;</button>
        <button class="panel-arrow panel-next" type="button" aria-label="next">&#8250;</button>

        <div class="panel-viewport">
          <div class="panel-strip">

            <article class="panel" id="panel-beats" aria-label="beats">
              <h2 class="chapel-title">the beats</h2>
              <div class="altar-frame">
                <iframe
                  src="https://player.beatstars.com/?storeId=PLACEHOLDER"
                  title="prodfish beats on BeatStars"
                  loading="lazy"
                  allow="autoplay"
                ></iframe>
              </div>
              <a class="bs-link" href="https://www.beatstars.com/PLACEHOLDER" target="_blank" rel="noopener">
                open on beatstars &#8599;
              </a>
            </article>

            <article class="panel" id="panel-work" aria-label="the work">
              <h2 class="chapel-title">the work</h2>
              <ul class="work-list"></ul>
              <a class="bs-link work-catalog" target="_blank" rel="noopener">the full catalog &#8599;</a>
            </article>

            <article class="panel" id="panel-about" aria-label="about">
              <h2 class="chapel-title">about</h2>
              <p class="work-bio"></p>
              <nav class="work-socials" aria-label="social links"></nav>
              <p class="contact">
                custom work &mdash; <a href="mailto:beats@prodfish.com">beats@prodfish.com</a>
              </p>
            </article>

          </div>
        </div>

        <nav class="panel-dots" aria-label="choose a panel"></nav>
      </div>

      <footer class="chapel-footer">
        &copy; prodfish. recorded after dark.<br />
        3d: <a href="https://sketchfab.com/3d-models/church-867a847b67364484bf44912e1af190af" target="_blank" rel="noopener">church &mdash; tiago lopes</a> (cc-by) &middot; <a href="https://sketchfab.com/3d-models/crow-d5a9b0df4da3493688b63ce42c8a83e2" target="_blank" rel="noopener">crow &mdash; alexei ostapenko</a> (cc-by)
      </footer>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

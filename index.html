<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the scene fill past the notch; the fixed
       controls claim their clearance back via env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>prodfish — beats from the dark south</title>
  <meta name="description" content="prodfish. beats from the dark south. Production credits, catalog and custom work." />
  <link rel="canonical" href="https://prodfish.com/" />
  <meta name="theme-color" content="#050607" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="prodfish" />
  <meta property="og:title" content="prodfish — beats from the dark south" />
  <meta property="og:description" content="beats from the dark south. Production credits, catalog and custom work." />
  <meta property="og:url" content="https://prodfish.com/" />
  <meta property="og:image" content="https://prodfish.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="prodfish — beats from the dark south" />
  <meta name="twitter:description" content="beats from the dark south. Production credits, catalog and custom work." />
  <meta name="twitter:image" content="https://prodfish.com/og.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- UnifrakturMaguntia renders exactly four glyphs on this site, so it is
       requested with `&text=fish` — a ~40KB webfont reduced to a few hundred
       bytes. It is split into its own request because a `text=` subset cannot
       be combined with full families in one css2 call. -->
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&text=fish&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />

  <!-- The chapel is 4.2MB and is the one model the scene cannot open without.
       Without this hint its download does not begin until the ~800KB module
       graph has been fetched, parsed and executed; preloading starts it
       during HTML parse instead, off the critical path entirely. crossorigin
       is required for the hint to match the loader's own CORS-mode fetch —
       without it the file is downloaded twice. -->
  <link rel="preload" href="/models/church.glb" as="fetch" type="model/gltf-binary" crossorigin />
  <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" type="application/wasm" crossorigin />

  <!-- #loading is only ever cleared by JS adding .ready to <body>, and
       .no-webgl is likewise set from JS. With scripting off neither happens,
       so the page sat on a black screen forever. This lays the document out
       statically instead.
       The credits list and the bio are injected from src/content/portfolio.js
       at runtime (the carved stones along the approach read from the same
       source, so the two cannot drift), which means those two panels are
       genuinely empty without JS and are hidden rather than shown as bare
       headings. The BeatStars player and the contact address are static
       markup and work fine, so the page still does its main job. -->
  <noscript>
    <style>
      #loading, #scene, #blackout, #skip, #sound, #volume-row { display: none !important; }
      #hero { position: relative; height: 100dvh; }
      #scroll-track { height: auto; }
      #chapel { position: relative; opacity: 1; pointer-events: auto;
                background: radial-gradient(ellipse at 50% 30%, #2b0402, #0d0100 75%); }
      .panel { max-height: none; overflow: visible; }
      .panel-strip { display: block; }
      .panel-arrow, .panel-dots { display: none; }
      #panel-work, #panel-about .work-bio, #panel-about .work-socials { display: none; }
    </style>
  </noscript>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="glow" aria-hidden="true"></div>
  <div id="blackout" aria-hidden="true"></div>
  <div id="loading" aria-hidden="true">
    <span>entering&hellip;</span>
    <span class="load-bar"><span class="load-bar-fill"></span></span>
  </div>
  <button id="sound" type="button" aria-pressed="false" aria-label="turn ambient sound on">
    <span class="sound-mark" aria-hidden="true">&#9834;</span><span class="sound-word">sound</span>
  </button>
  <div id="volume-row">
    <span class="vol-end vol-low" aria-hidden="true">&minus;</span>
    <input id="volume" type="range" min="0" max="100" value="70"
           aria-label="ambient sound volume" />
    <span class="vol-end vol-high" aria-hidden="true">&plus;</span>
  </div>

  <header id="hero">
    <h1>fish</h1>
    <p class="hint">scroll<span class="hint-arrow">▾</span></p>
  </header>

  <!-- The journey is sixteen screens long. On a phone that is a lot of thumb
       for anyone who came for the catalog, so there is always a way straight
       to it. Kept out of #hero because #hero is pointer-events: none and
       fades out on scroll; this stays reachable for the whole approach. -->
  <a id="skip" href="#chapel">skip to the beats</a>

  <main id="scroll-track">
    <section id="chapel">
      <div class="panels" role="group" aria-roledescription="carousel" aria-label="beats, credits and about">
        <button class="panel-arrow panel-prev" type="button" aria-label="previous">&#8249;</button>
        <button class="panel-arrow panel-next" type="button" aria-label="next">&#8250;</button>

        <div class="panel-viewport">
          <div class="panel-strip">

            <article class="panel" id="panel-beats" aria-label="beats">
              <h2 class="chapel-title">the beats</h2>
              <div class="altar-frame">
                <iframe
                  src="https://player.beatstars.com/?storeId=PLACEHOLDER"
                  title="prodfish beats on BeatStars"
                  loading="lazy"
                  allow="autoplay"
                ></iframe>
              </div>
              <a class="bs-link" href="https://www.beatstars.com/PLACEHOLDER" target="_blank" rel="noopener">
                open on beatstars &#8599;
              </a>
            </article>

            <article class="panel" id="panel-work" aria-label="the work">
              <h2 class="chapel-title">the work</h2>
              <ul class="work-list"></ul>
              <a class="bs-link work-catalog" target="_blank" rel="noopener">the full catalog &#8599;</a>
            </article>

            <article class="panel" id="panel-about" aria-label="about">
              <h2 class="chapel-title">about</h2>
              <p class="work-bio"></p>
              <nav class="work-socials" aria-label="social links"></nav>
              <p class="contact">
                custom work &mdash; <a href="mailto:beats@prodfish.com">beats@prodfish.com</a>
              </p>
            </article>

          </div>
        </div>

        <nav class="panel-dots" aria-label="choose a panel"></nav>
      </div>

      <footer class="chapel-footer">
        &copy; prodfish. recorded after dark.<br />
        3d: <a href="https://sketchfab.com/3d-models/church-867a847b67364484bf44912e1af190af" target="_blank" rel="noopener">church &mdash; tiago lopes</a> (cc-by) &middot; <a href="https://sketchfab.com/3d-models/crow-d5a9b0df4da3493688b63ce42c8a83e2" target="_blank" rel="noopener">crow &mdash; alexei ostapenko</a> (cc-by)
      </footer>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
